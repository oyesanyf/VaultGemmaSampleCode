name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install "pytest>=8.0.0" "black>=26.3.1" "flake8>=7.0.0" "mypy>=1.11.0"

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Type check with mypy
        run: |
          mypy setup.py tests/ --ignore-missing-imports

      - name: Run unit test suite
        run: |
          python -m pytest -v tests/

      - name: End-to-end CLI data encryption, listing, and cleanup
        run: |
          python LLM_Diffrential_Privacy.py --encrypt-data --records 10 --dp-data-eps 1.0
          python LLM_Diffrential_Privacy.py --list-data --reveal-dp
          python LLM_Diffrential_Privacy.py --list
          python LLM_Diffrential_Privacy.py --clean

      - name: Optional gated VaultGemma training check (when HF_TOKEN is configured)
        if: ${{ env.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python LLM_Diffrential_Privacy.py --train --records 5 --epochs 1 --batch_size 1 --seq-len 128
          python LLM_Diffrential_Privacy.py --list
          python LLM_Diffrential_Privacy.py --clean

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Security scan with bandit
        run: |
          set +e
          bandit -r LLM_Diffrential_Privacy.py test_model_queries.py setup.py -ll -f json -o bandit-report.json
          rc=$?
          set -e
          cat bandit-report.json
          exit $rc

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel

      - name: Build package
        run: |
          python -m build

      - name: Validate package metadata with twine
        run: |
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  performance:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install psutil

      - name: Performance benchmark - DP data generation
        run: |
          time python LLM_Diffrential_Privacy.py --encrypt-data --records 50 --dp-data-eps 1.0
          python LLM_Diffrential_Privacy.py --clean
